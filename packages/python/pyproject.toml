[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "cargoflow"
version = "0.1.0"
description = "CargoFlow Python SDK: typed read access to the CargoFlow API, pandas/polars data frames and portfolio risk analytics (exposure, excursions, conflicts, release latency, recoveries, Monte Carlo of default and recovery), plus gateway request signing."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "CargoFlow" }]
keywords = ["cargoflow", "trade-finance", "cold-chain", "analytics", "pandas", "risk", "monte-carlo"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "pandas>=2.1",
  "numpy>=1.26",
  "cryptography>=42",
]

[project.optional-dependencies]
polars = ["polars>=1.0"]
notebooks = ["jupyter>=1.0", "nbconvert>=7.0", "ipykernel>=6.0", "matplotlib>=3.8"]
dev = [
  "pytest>=8.0",
  "respx>=0.21",
  "polars>=1.0",
  "nbformat>=5.9",
]

[project.urls]
Homepage = "https://cargoflow.adoranto737.workers.dev"
Documentation = "https://github.com/LSUDOKO/CargoFlow/tree/main/packages/python#readme"
Repository = "https://github.com/LSUDOKO/CargoFlow"
Source = "https://github.com/LSUDOKO/CargoFlow/tree/main/packages/python"
Issues = "https://github.com/LSUDOKO/CargoFlow/issues"
Changelog = "https://github.com/LSUDOKO/CargoFlow/blob/main/CHANGELOG.md"
"API reference" = "https://cargoflow.adoranto737.workers.dev/docs"

[tool.hatch.build.targets.wheel]
packages = ["src/cargoflow"]

[tool.hatch.build.targets.sdist]
include = ["src/cargoflow", "tests", "examples", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: read-only smoke test against the live CargoFlow API (run with -m live)"]
filterwarnings = ["error::DeprecationWarning:cargoflow.*"]
