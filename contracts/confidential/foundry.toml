# Separate Foundry project: CoFHE (Fhenix) runs on Ethereum / Arbitrum / Base Sepolia, not on Robinhood Chain.
# Versions follow https://cofhe-docs.fhenix.zone/get-started/introduction/compatibility
[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["node_modules"]
solc_version = "0.8.25"      # the compiler @fhenixprotocol/cofhe-contracts 0.2.0 targets
auto_detect_remappings = false
code_size_limit = 100000     # the CoFHE mocks exceed EIP-170; production contracts do not
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"
