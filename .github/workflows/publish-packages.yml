name: Publish packages (GitHub Packages)

# Mirrors the npm packages to GitHub Packages as @lsudoko/cargoflow-{sdk,mcp,gateway} and pushes the backend and
# gateway images to GHCR, so they appear in the repository's Packages sidebar. The primary npm packages
# (@cargoflow/*) and PyPI (cargoflow) are published separately. Steps and local commands: docs/releases/github-packages.md

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Pack and build only; publish and push nothing"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm:
    name: npm → npm.pkg.github.com
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: "@lsudoko"

      # each package is its own pnpm root and pins its pnpm version in packageManager
      - run: corepack enable

      - name: Build the packages
        run: |
          for p in sdk mcp gateway; do
            echo "::group::packages/$p"
            (cd "packages/$p" && pnpm install --frozen-lockfile && pnpm build)
            echo "::endgroup::"
          done
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

      - name: Publish @lsudoko/cargoflow-sdk, -mcp, -gateway
        run: node scripts/publish-github-packages.mjs ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PACKAGES_SCOPE: lsudoko
          GH_PACKAGES_REPO: https://github.com/${{ github.repository }}

  images:
    name: image → ghcr.io/lsudoko/${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: cargoflow-backend
            context: .
            file: infra/docker/backend.Dockerfile
            platforms: linux/amd64 # the Dockerfile fetches the amd64 circom binary
            description: CargoFlow evidence service (Go API, indexer, evidence pipeline, AI monitor) with the Groth16 prover
          - image: cargoflow-gateway
            context: packages/gateway
            file: packages/gateway/Dockerfile
            platforms: linux/amd64,linux/arm64
            description: CargoFlow evidence gateway for data loggers (folder watch, USB, serial, offline queue)
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
        if: contains(matrix.platforms, 'arm64')

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: ${{ !inputs.dry_run }}
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/lsudoko/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
          labels: |
            org.opencontainers.image.title=${{ matrix.image }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          annotations: |
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ matrix.platforms }}
          push: ${{ !inputs.dry_run }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
