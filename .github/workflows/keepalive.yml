name: keepalive

# Render's free plan sleeps a web service after 15 minutes without traffic; a health check every 10 minutes keeps
# the API warm (GitHub may delay scheduled runs by a few minutes under load).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: GET /v1/health
        run: |
          curl --silent --show-error --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors \
            --output /dev/null --write-out "status %{http_code} in %{time_total}s\n" \
            https://cargoflow-api-75ul.onrender.com/v1/health
